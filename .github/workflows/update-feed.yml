name: Update news feed

on:
  schedule:
    # Every hour from about 5:30 AM to 10:30 PM IST. (00:30–16:30 UTC).
    - cron: "7 0-17 * * *"
  workflow_dispatch: {}      # adds a "Run workflow" button for manual refresh

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python fetch_news.py

      - name: Save feed to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
